name: EPIC CRYSTAL EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip `
            -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem ffmpeg -Filter ffmpeg.exe -Recurse |
            Select-Object -First 1
          Copy-Item $exe.FullName ffmpeg.exe

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name EPIC_CRYSTAL `
            --add-binary "ffmpeg.exe;." `
            --runtime-hook hook_ffmpeg.py `
            epic_apkhack.py

      - uses: actions/upload-artifact@v4
        with:
          name: EPIC-CRYSTAL-WINDOWS
          path: dist/EPIC_CRYSTAL.exe
